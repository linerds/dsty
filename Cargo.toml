[package]
name = "dsty"
version = "1.0.0-alpha.5"
edition = "2024"
rust-version = "1.92"
description = "DSTU 3008:2015 linter and LSP server for Typst documents"
license = "GPL-3.0-only"
authors = ["beauloxe"]
readme = "README.md"
keywords = ["typst", "linter", "lsp", "dstu"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
typst-syntax = "0.15.1"
regex = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
